services:
  neo4j:
    image: neo4j:5
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/cosmicYggdrasil #usr: neo4j, pwd: cosmicYggdrasil
      - NEO4J_PLUGINS=["apoc","n10s"]
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
